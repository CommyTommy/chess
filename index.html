<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Chess Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="start-menu">
            <h1>Welcome to the Chess Game</h1>
            <p>Pick your color to start the game</p>
            <button id="white-button" onclick="selectPlayerColor(true)">White</button>
            <button id="black-button" onclick="selectPlayerColor(false)">Black</button>
        </div>
		<div id="chessboard">
        </div>
        <div id="game-over-modal" class="hidden">
            <div class="modal-content">
                <h2 id="winner-text">Checkmate!</h2>
                <button id="restart-button" onclick="restartGame()">Play Again</button>
            </div>
        </div>
    </body>
    <script src="app.js"></script>
</html>
